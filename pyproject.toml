[tool.black]
line-length = 120

[tool.isort]
line_length = 120

[tool.flake8]
max-line-length = 120

[tool.pylint.master]
init-hook = 'import sys; sys.path.insert(0, ".")'

[tool.pylint.messages_control]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "R0903",  # too-few-public-methods (Pydantic Config inner classes)
    "R0801",  # duplicate-code
    "C0411",  # wrong-import-order (pre-existing in schema files)
]

[tool.pylint.format]
max-line-length = 150

# FastAPI route handlers routinely take several Depends()/Query() params and
# build multi-field response dicts, so the pylint defaults (5 args, 15
# locals, 12 branches, 50 statements) are miscalibrated for this codebase's
# API layer — not a sign the endpoints are actually unmaintainable. Sized to
# comfortably cover current handlers with modest headroom, not unlimited.
[tool.pylint.design]
max-args = 10
max-positional-arguments = 10
max-locals = 30
max-branches = 20
max-statements = 55